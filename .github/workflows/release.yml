name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.3.0, sans le préfixe v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .app
        run: ./build.sh "${{ steps.version.outputs.value }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: MacintoshHDisTooSmall v${{ steps.version.outputs.value }}
          files: dist/*.zip
          body: |
            Application macOS (universelle, macOS 14+) pour déplacer des apps de `/Applications` vers un autre volume, caches et configurations compris.

            **Installation**

            1. Décompresser le `.zip`, glisser `MacintoshHDisTooSmall.app` dans `/Applications`.
            2. Le binaire est signé ad hoc, pas notarisé. Au premier lancement macOS le bloque ; lever la mise en quarantaine :

               ```
               xattr -dr com.apple.quarantine /Applications/MacintoshHDisTooSmall.app
               ```
